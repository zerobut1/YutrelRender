[project]
name = "lc-sandbox"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "openexr>=3.4.13",
    "pillow>=12.3.0",
    "pyside6>=6.10.0",
]

[project.gui-scripts]
YutrelStudio = "yutrel_studio.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.15.21",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "yutrel_studio"
module-root = "frontend"

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
